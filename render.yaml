# Render Blueprint for the Family Identity & Beneficiary Management Platform.
#
# Apply with: Render Dashboard -> New -> Blueprint -> pick this repository.
# It provisions the database and wires DATABASE_URL automatically, so the
# backend can never be left pointing at a local development database.

databases:
  - name: fip-postgres
    databaseName: family_identity
    user: fip
    plan: free

services:
  # ---------------------------------------------------------------------------
  # Backend API
  # ---------------------------------------------------------------------------
  - type: web
    name: fip-backend
    runtime: node
    plan: free
    rootDir: backend
    # Migrations run at build time so the schema is in place before the first
    # request. `migrate deploy` only applies committed migrations and never
    # generates or resets anything.
    buildCommand: npm ci && npx prisma migrate deploy
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fip-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: UPLOAD_DIR
        value: ./uploads
      - key: MAX_UPLOAD_SIZE_BYTES
        value: "5242880"
      # Set this to the frontend's Render URL once it is deployed, so the API
      # does not accept browser requests from arbitrary origins.
      - key: CORS_ORIGIN
        sync: false

    # Uploaded documents live on the instance filesystem, which Render wipes on
    # every deploy and restart. A persistent disk fixes that but requires a
    # paid instance type; for a hackathon demo the loss is acceptable, and for
    # anything longer the right answer is S3-compatible object storage.
    #
    # disk:
    #   name: fip-uploads
    #   mountPath: /opt/render/project/src/backend/uploads
    #   sizeGB: 1

  # ---------------------------------------------------------------------------
  # Frontend
  # ---------------------------------------------------------------------------
  - type: web
    name: fip-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # Full URL of the backend API, e.g. https://fip-backend.onrender.com/api
      - key: VITE_API_URL
        sync: false
    routes:
      # React Router owns client-side paths, so every unmatched request has to
      # return index.html rather than a 404 from the static host.
      - type: rewrite
        source: /*
        destination: /index.html
